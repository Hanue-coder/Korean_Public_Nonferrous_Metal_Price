name: Daily Price Update

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 평일 오전 11시 (KST = UTC+9)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install scrapling curl_cffi anthropic python-dotenv

      - name: Scrape prices from 조달청
        run: python scrape_prices.py

      - name: Generate dashboard data
        run: python generate_dashboard.py

      - name: Generate issue analysis (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_issues.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv issues_data.js issues_cache.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 가격 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
